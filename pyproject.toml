[project]
name = "thema"
version = "0.1.0"
description = "Cluster biological pathways into a hierarchical ontology and run enrichment statistics."
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.2.0",
    "hdbscan>=0.8.44",
    "infomap>=2.15.1",
    "numpy==2.3.4",
    "scikit-learn>=1.9.0",
    "scikit-network>=0.33.5",
    "scipy==1.16.3",
    "sentence-transformers==5.1.2",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thema"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The browsing page is one embedded HTML/CSS/JS string; wrapping it would break it.
"scripts/export_browse.py" = ["E501"]
"tests/*" = ["D", "ANN"]
"src/thema/__init__.py" = ["D104"]
